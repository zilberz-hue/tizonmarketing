<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>טיזון | מערכת שיווק ופרסום</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#9a6a2a">
  <link rel="apple-touch-icon" href="../assets/icon-192.png">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" class="login"><form id="login-form" class="panel"><h3>התחברות</h3>
  <label>אימייל <input name="email" type="email" required autocomplete="username"></label>
  <label>סיסמה <span class="pw"><input name="password" type="password" required autocomplete="current-password"><button type="button" class="eye" id="toggle-pw" aria-label="הצגת סיסמה" aria-pressed="false"><svg class="i-show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.7 18.7 0 0 1 5.1-5.9M9.9 5.1A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a18.5 18.5 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/></svg></button></span></label>
  <button class="btn btn-sm">כניסה</button></form></div>
<header class="header"><div class="container nav">
  <a class="logo" href="../index.html"><img src="../assets/logo.webp" alt="TizonHealth" width="68" height="58"></a>
  <nav id="tabs">
    <button data-tab="dash" class="active">סקירה</button>
    <button data-tab="plan">✅ תוכנית עבודה</button>
    <button data-tab="campaigns">קמפיינים</button>
    <button data-tab="content">לוח תוכן</button>
    <button data-tab="leads">לידים</button>
    <button data-tab="reports">דוחות</button>
    <button data-tab="settings" id="tab-settings" hidden>⚙️ הגדרות</button>
  </nav>
  <div class="io">
    <select id="ws-switch" aria-label="סביבת עבודה" hidden></select>
    <button class="btn btn-sm btn-ghost" id="install-btn" hidden>📲 התקנה</button>
    <button class="btn btn-sm" id="export">ייצוא</button>
    <button class="btn btn-sm" id="logout">יציאה</button>
  </div>
</div></header>

<main class="container app">
  <section id="dash" class="tab active"></section>

  <section id="plan" class="tab"></section>

  <section id="campaigns" class="tab">
    <div class="bar"><h2>קמפיינים</h2><span class="acts"><button class="btn btn-sm" data-act="quick-open">✨ קמפיין בדקה</button><button class="btn btn-sm btn-ghost" id="new-campaign">+ קמפיין ידני</button></span></div>
    <form id="campaign-form" class="panel" hidden>
      <h3>תכנון קמפיין – 6 שלבים</h3>
      <label>1. שם הקמפיין <input name="name" required></label>
      <label>2. יעד
        <select name="goal"><option>לידים</option><option>מכירות</option><option>מודעות למותג</option><option>תנועה לאתר</option><option>שימור לקוחות</option></select></label>
      <label>3. קהל יעד (גיל, אזור, תחומי עניין, בעיה שאתם פותרים) <textarea name="audience" rows="2"></textarea></label>
      <fieldset><legend>4. ערוצים</legend>
        <label class="chk"><input type="checkbox" name="ch" value="Google"> גוגל</label>
        <label class="chk"><input type="checkbox" name="ch" value="Facebook"> פייסבוק</label>
        <label class="chk"><input type="checkbox" name="ch" value="Instagram"> אינסטגרם</label>
        <label class="chk"><input type="checkbox" name="ch" value="TikTok"> טיקטוק</label>
        <label class="chk"><input type="checkbox" name="ch" value="LinkedIn"> לינקדאין</label>
        <label class="chk"><input type="checkbox" name="ch" value="Email"> אימייל</label>
        <label class="chk"><input type="checkbox" name="ch" value="WhatsApp"> וואטסאפ</label>
        <label class="chk"><input type="checkbox" name="ch" value="SEO"> SEO</label>
      </fieldset>
      <div class="row">
        <label>5. תקציב (₪) <input name="budget" type="number" min="0" value="0"></label>
        <label>יעד לידים/מכירות <input name="target" type="number" min="0" value="0"></label>
        <label>התחלה <input name="start" type="date"></label>
        <label>סיום <input name="end" type="date"></label>
      </div>
      <label>6. מסר מרכזי והצעה <textarea name="message" rows="2"></textarea></label>
      <div class="bar"><button class="btn btn-sm" type="submit">שמירה</button><button type="button" class="link" id="cancel-campaign">ביטול</button></div>
    </form>
    <div class="seg" id="camp-view" role="group" aria-label="תצוגת קמפיינים"><button type="button" data-view="list" class="on">רשימה</button><button type="button" data-view="board">לוח גרירה</button></div>
    <p class="meta" id="camp-hint">גררו את ⠿ כדי לשנות סדר, או השתמשו בחצים ▲▼. בלוח גרירה אפשר להעביר קמפיין בין "פעיל", "מושהה" ו"הסתיים".</p>
    <div id="campaign-list"></div>
    <div id="campaign-board" class="board" hidden></div>
  </section>

  <section id="content" class="tab">
    <div class="bar"><h2>לוח תוכן ותזמון</h2></div>
    <form id="post-form" class="panel">
      <div class="row">
        <label>קמפיין <select name="campaign" id="post-campaign"></select></label>
        <label>ערוץ <select name="channel"><option>Facebook</option><option>Instagram</option><option>TikTok</option><option>LinkedIn</option><option>Google</option><option>Email</option><option>WhatsApp</option><option>Telegram</option><option>בלוג</option></select></label>
        <label>תאריך <input name="date" type="date" required></label>
        <label>שעה <input name="time" type="time" value="10:00"></label>
      </div>
      <label>טקסט / קריאייטיב <textarea name="text" rows="3" required></textarea></label>
      <div id="post-risk" class="risk" hidden></div>
      <input type="hidden" name="image">
      <div class="imgrow"><button type="button" class="link" id="post-img">📷 הוספת תמונה</button><button type="button" class="link" id="post-studio">🎨 יצירת תמונה / באנר</button><span id="post-img-preview"></span></div>
      <div class="bar"><button class="btn btn-sm" type="submit">הוספה ללוח</button><button type="button" class="link" id="ai-text" hidden>✨ כתיבה עם AI</button></div>
    </form>
    <div class="seg" id="content-view" role="group" aria-label="תצוגה"><button type="button" data-view="list" class="on">רשימה</button><button type="button" data-view="month">חודש</button></div>
    <div id="cal" hidden></div>
    <div id="post-list"></div>
  </section>

  <section id="leads" class="tab">
    <div class="bar"><h2>לידים</h2></div>
    <form id="lead-form-app" class="panel">
      <div class="row">
        <label>שם <input name="name" required></label>
        <label>טלפון <input name="phone" type="tel"></label>
        <label>אימייל <input name="email" type="email"></label>
        <label>קמפיין / מקור <select name="campaign" id="lead-campaign"></select></label>
        <label>שווי עסקה (₪) <input name="value" type="number" min="0" value="0"></label>
      </div>
      <button class="btn btn-sm" type="submit">הוספת ליד</button>
    </form>
    <div id="pipeline" class="pipeline"></div>
  </section>

  <section id="reports" class="tab">
    <div id="reports-body"></div>
    <div class="panel" id="insights">
      <div class="bar"><h3>💡 תובנות והמלצות</h3><button class="btn btn-sm" id="insights-ai" hidden>✨ ניתוח עמוק עם AI</button></div>
      <ul id="insights-list" class="insights"></ul>
    </div>
  </section>
  <section id="settings" class="tab"></section>
</main>
<dialog id="quick" class="quick" aria-labelledby="quick-title">
  <form method="dialog" class="x"><button aria-label="סגירה">✕</button></form>
  <div id="quick-body"></div>
</dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
<script src="plan.js"></script>
<script src="extras.js"></script>
<script src="ai-assist.js"></script>
<script src="studio.js"></script>
</body>
</html>
